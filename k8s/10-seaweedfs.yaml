# Single-pod SeaweedFS (master + volume + filer + S3 gateway). The S3 identities
# come from the Secret "seaweedfs-s3-config", created by `make secrets` (never committed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=0",
                 "-master.volumeSizeLimitMB=64", "-master.volumePreallocate=false", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports: [{containerPort: 8333, name: s3}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            tcpSocket: {port: 8333}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333, nodePort: 30333}
